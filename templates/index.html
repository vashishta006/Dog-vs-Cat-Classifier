<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat vs Dog Classifier</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 550px;
            text-align: center;
            padding: 40px 25px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #64748b;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin: 10px 0;
            color: white;
        }

        #preview {
            display: none;
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 12px;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            font-size: 28px;
            font-weight: bold;
        }

        .confidence {
            margin-top: 8px;
            color: #93c5fd;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🐱 Cat vs Dog 🐶</h1>

        <p class="subtitle">
            Upload an image and let AI identify it
        </p>

        <form method="POST" enctype="multipart/form-data">

            <div class="upload-box">

                <p>Select an image</p>

                <input
                    type="file"
                    name="image"
                    accept="image/*"
                    onchange="showPreview(event)"
                    required
                >

                <img id="preview">

            </div>

            <button type="submit">
                🔍 Predict
            </button>

        </form>

        {% if prediction %}

            <div class="result">
                {{ prediction }}
            </div>

            <div class="confidence">
                Confidence: {{ "%.2f"|format(confidence) }}%
            </div>

        {% endif %}

    </div>

    <script>
        function showPreview(event) {
            const image = document.getElementById("preview");
            image.src = URL.createObjectURL(event.target.files[0]);
            image.style.display = "block";
        }
    </script>

</body>
</html>
